# One-tap example claims, shown as "heard something?" starters. These are test inputs,
# not statements of fact. Draft translations (unreviewed) for every language but English.
starters:
  en:
    - F-1 students can work 30 hours per week on campus.
    - Every international student can get an SSN without a job.
    - International students never need to file US tax forms.
    - OPT now costs $70,000
    - STEM OPT is ending
  ar:
    - يمكن لطلاب F-1 العمل 30 ساعة أسبوعيًا داخل الحرم الجامعي.
    - يمكن لأي طالب دولي الحصول على رقم الضمان الاجتماعي (SSN) دون وظيفة.
    - لا يحتاج الطلاب الدوليون إلى تقديم أي نماذج ضريبية أمريكية.
    - أصبحت تكلفة OPT الآن 70,000 دولار
    - برنامج STEM OPT سينتهي
  zh:
    - F-1学生每周可以在校内工作30小时。
    - 每个国际学生都可以在没有工作的情况下申请SSN。
    - 国际学生从不需要提交美国税表。
    - OPT现在要花7万美元
    - STEM OPT要取消了
  yue:
    - F-1學生每星期可以喺校內工作30小時。
    - 每個國際學生冇工作都可以申請SSN。
