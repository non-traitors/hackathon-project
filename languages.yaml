# Language registry: one place for everything language-specific.
#
# DRAFT TRANSLATIONS. Every language except English is marked `reviewed: false`:
# the wording below was drafted by Claude and has NOT been checked by a native
# speaker. The UI shows a "beta" notice for unreviewed languages. Set
# `reviewed: true` only after a native speaker has checked the language against
# the rubric in readme.md (meaning, conditions kept, terminology, tone).
#
# Fields
#   display      name shown in the language picker
#   aliases      other names accepted when a caller passes a language by name
#   model_name   exact instruction given to Gemini for the answer language
#   rtl          right-to-left script
#   reviewed     see above
#   verdicts     localized labels; the English label is always shown too
#   ui           static interface strings ({office} is filled in by the app)
#   glossary     fixed wording for key terms; acronyms stay in Latin letters
#   keywords     claim words (in this language) that route to a topic; matched
#                as substrings for non-Latin scripts and as whole words otherwise

languages:
  en:
    display: English
    aliases: []
    model_name: English
    rtl: false
    reviewed: true
    verdicts: {Supported: Supported, Contradicted: Contradicted, Unclear: Unclear,
               In effect: In effect, Proposed only: Proposed only, Blocked: Blocked}
    ui:
      app_title: Is This Still True?
      tagline: Check what you heard against official sources.
      starters_label: Heard something? Start here.
      paste_label: Or paste what you heard
      placeholder: 'e.g. "Is OPT still available after graduation?"'
      school_label: Your school
      language_label: Answer language
      check_button: Check it
      privacy_note: Don't enter passport, I-94 or immigration document numbers. Nothing you type is saved.
      progress: Reading official sources. This usually takes 10 to 25 seconds.
      we_checked: We checked
      applies_to: Applies to
      depends_on: It depends on
      next_step: Next step
      office_question: Question to send your school's office (in English)
      sources: Sources
      unclear_title: You don't have to figure it out alone.
      unclear_body: Share this with your school's international student office before you make plans or pay a fee.
      disclaimer: Not legal advice. Confirm with {office}.
      beta: Beta translation. A native speaker has not reviewed it yet.
      date_unknown: Date not shown
      out_of_scope: This is outside what we can check. Please ask your school's international student office.
      new_check: "← New check"
      home_eyebrow: "CLARITY FOR F-1 STUDENTS"
      home_title: "OPT check"
      home_subtitle: "Clear answers to F-1 OPT rumors."
      sources_note: "We look for government & university sources."
